name: Linting

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; jobs opt into the extra scopes they need.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # reviewdog posts inline review comments and a check run.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Lint with the project's flat config (eslint.config.js) and surface
      # findings as inline PR review comments via reviewdog.
      - name: Run eslint via reviewdog
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          eslint_flags: "."
